<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#08111f"/>
    <stop offset="55%" stop-color="#10233d"/>
    <stop offset="100%" stop-color="#060a12"/>
  </linearGradient>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd166"/>
    <stop offset="100%" stop-color="#fca311"/>
  </linearGradient>
  <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; }
    .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #e2e8f0; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; font-size: 18px; }
    .tiny { font-family: Arial, Helvetica, sans-serif; fill: #94a3b8; font-size: 14px; }
    .box { fill: rgba(15, 23, 42, 0.82); stroke: #38bdf8; stroke-width: 2; rx: 24; filter: url(#softshadow); }
    .boxgold { fill: rgba(30, 24, 10, 0.88); stroke: #fbbf24; stroke-width: 2.5; rx: 24; filter: url(#softshadow); }
    .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .arrowgold { stroke: #fbbf24; stroke-width: 3.5; fill: none; marker-end: url(#arrowheadgold); }
    .line { stroke: #475569; stroke-width: 1.5; opacity: 0.55; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#93c5fd"/>
  </marker>
  <marker id="arrowheadgold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#fbbf24"/>
  </marker>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="800" y="70" class="title" font-size="40" text-anchor="middle">Figure 2 — Structure Preservation Under Transformation</text>
<text x="800" y="110" class="subtitle" font-size="22" text-anchor="middle">CCC(T(X)) ≈ CCC(X): operational identity remains stable while structures evolve</text>
<rect x="100" y="260" width="340" height="230" class="box" rx="24"/>
<text x="270.0" y="298" class="small" font-size="20" text-anchor="middle">Original Structure</text>
<text x="270.0" y="324" class="small" font-size="20" text-anchor="middle">Calling Graph</text>
<text x="270.0" y="350" class="small" font-size="20" text-anchor="middle">Trajectory</text>
<text x="270.0" y="376" class="small" font-size="20" text-anchor="middle">Runtime Paths</text>
<rect x="630" y="260" width="340" height="230" class="boxgold" rx="24"/>
<text x="800.0" y="298" class="small" font-size="20" text-anchor="middle">Transformation</text>
<text x="800.0" y="324" class="small" font-size="20" text-anchor="middle">Diffusion</text>
<text x="800.0" y="350" class="small" font-size="20" text-anchor="middle">Rewrite</text>
<text x="800.0" y="376" class="small" font-size="20" text-anchor="middle">Recursive Ops</text>
<rect x="1160" y="260" width="340" height="230" class="box" rx="24"/>
<text x="1330.0" y="298" class="small" font-size="20" text-anchor="middle">Evolved Structure</text>
<text x="1330.0" y="324" class="small" font-size="20" text-anchor="middle">Rewritten Graph</text>
<text x="1330.0" y="350" class="small" font-size="20" text-anchor="middle">Adapted Runtime</text>
<text x="1330.0" y="376" class="small" font-size="20" text-anchor="middle">New Trajectory</text>
<path d="M445 375 C520 375 560 375 625 375" class="arrowgold"/>
<path d="M975 375 C1050 375 1090 375 1155 375" class="arrowgold"/>
<circle cx="270" cy="680" r="88" fill="url(#gold)" opacity="0.92" filter="url(#glow)"/>
<text x="270" y="674" class="label" font-size="20" text-anchor="middle">CCC Core</text>
<circle cx="800" cy="680" r="88" fill="url(#gold)" opacity="0.92" filter="url(#glow)"/>
<text x="800" y="674" class="label" font-size="20" text-anchor="middle">Preservation Field</text>
<circle cx="1330" cy="680" r="88" fill="url(#gold)" opacity="0.92" filter="url(#glow)"/>
<text x="1330" y="674" class="label" font-size="20" text-anchor="middle">CCC Core</text>
<path d="M360 680 C540 600 1060 600 1240 680" class="arrowgold"/>
<path d="M1240 705 C1040 810 560 810 360 705" class="arrow"/>
<text x="800" y="835" class="subtitle" font-size="22" text-anchor="middle">Operational structural identity is approximately preserved</text>
<text x="800" y="867" class="subtitle" font-size="22" text-anchor="middle">even when surface forms, graphs, and runtime paths change.</text>
</svg>

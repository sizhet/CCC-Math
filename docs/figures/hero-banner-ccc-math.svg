<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="600" viewBox="0 0 1800 600">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#08111f"/>
    <stop offset="55%" stop-color="#10233d"/>
    <stop offset="100%" stop-color="#060a12"/>
  </linearGradient>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd166"/>
    <stop offset="100%" stop-color="#fca311"/>
  </linearGradient>
  <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; }
    .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #e2e8f0; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; font-size: 18px; }
    .tiny { font-family: Arial, Helvetica, sans-serif; fill: #94a3b8; font-size: 14px; }
    .box { fill: rgba(15, 23, 42, 0.82); stroke: #38bdf8; stroke-width: 2; rx: 24; filter: url(#softshadow); }
    .boxgold { fill: rgba(30, 24, 10, 0.88); stroke: #fbbf24; stroke-width: 2.5; rx: 24; filter: url(#softshadow); }
    .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .arrowgold { stroke: #fbbf24; stroke-width: 3.5; fill: none; marker-end: url(#arrowheadgold); }
    .line { stroke: #475569; stroke-width: 1.5; opacity: 0.55; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#93c5fd"/>
  </marker>
  <marker id="arrowheadgold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#fbbf24"/>
  </marker>
</defs>
<rect width="1800" height="600" fill="url(#bg)"/>
<circle cx="300" cy="300" r="210" fill="url(#gold)" opacity="0.22" filter="url(#glow)"/>
<circle cx="300" cy="300" r="115" fill="url(#gold)" opacity="0.86" filter="url(#glow)"/>
<text x="300" y="285" class="label" font-size="36" text-anchor="middle">CCC</text>
<text x="300" y="333" class="label" font-size="36" text-anchor="middle">MATH</text>
<text x="580" y="210" class="title" font-size="72">CCC Math</text>
<text x="585" y="280" class="subtitle" font-size="34">A Structural Algebra for DBM-SI, Autonomous AI Coding,</text>
<text x="585" y="325" class="subtitle" font-size="34">and Recursive Structural Intelligence</text>
<text x="585" y="410" class="small" font-size="24">Common Concept Core • Structure Preservation • Recursive Evolution</text>
<circle cx="1260" cy="170" r="48" fill="#0f172a" stroke="#7dd3fc" stroke-width="3"/>
<text x="1260" y="176" class="small" font-size="18" text-anchor="middle">CCC</text>
<circle cx="1450" cy="250" r="48" fill="#0f172a" stroke="#7dd3fc" stroke-width="3"/>
<text x="1450" y="256" class="small" font-size="18" text-anchor="middle">CCC</text>
<circle cx="1320" cy="410" r="48" fill="#0f172a" stroke="#7dd3fc" stroke-width="3"/>
<text x="1320" y="416" class="small" font-size="18" text-anchor="middle">CCC</text>
<circle cx="1600" cy="400" r="48" fill="#0f172a" stroke="#7dd3fc" stroke-width="3"/>
<text x="1600" y="406" class="small" font-size="18" text-anchor="middle">CCC</text>
<circle cx="1570" cy="135" r="48" fill="#0f172a" stroke="#7dd3fc" stroke-width="3"/>
<text x="1570" y="141" class="small" font-size="18" text-anchor="middle">CCC</text>
<path d="M1260 170 L1450 250" class="line"/>
<path d="M1450 250 L1320 410" class="line"/>
<path d="M1450 250 L1600 400" class="line"/>
<path d="M1260 170 L1570 135" class="line"/>
<path d="M1570 135 L1600 400" class="line"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#08111f"/>
    <stop offset="55%" stop-color="#10233d"/>
    <stop offset="100%" stop-color="#060a12"/>
  </linearGradient>
  <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffd166"/>
    <stop offset="100%" stop-color="#fca311"/>
  </linearGradient>
  <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#7dd3fc"/>
    <stop offset="100%" stop-color="#2563eb"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softshadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
  </filter>
  <style>
    .title { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #f8fafc; }
    .subtitle { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; }
    .label { font-family: Arial, Helvetica, sans-serif; font-weight: 700; fill: #e2e8f0; }
    .small { font-family: Arial, Helvetica, sans-serif; fill: #cbd5e1; font-size: 18px; }
    .tiny { font-family: Arial, Helvetica, sans-serif; fill: #94a3b8; font-size: 14px; }
    .box { fill: rgba(15, 23, 42, 0.82); stroke: #38bdf8; stroke-width: 2; rx: 24; filter: url(#softshadow); }
    .boxgold { fill: rgba(30, 24, 10, 0.88); stroke: #fbbf24; stroke-width: 2.5; rx: 24; filter: url(#softshadow); }
    .arrow { stroke: #93c5fd; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
    .arrowgold { stroke: #fbbf24; stroke-width: 3.5; fill: none; marker-end: url(#arrowheadgold); }
    .line { stroke: #475569; stroke-width: 1.5; opacity: 0.55; }
  </style>
  <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#93c5fd"/>
  </marker>
  <marker id="arrowheadgold" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
    <polygon points="0 0, 10 4, 0 8" fill="#fbbf24"/>
  </marker>
</defs>
<rect width="1600" height="1000" fill="url(#bg)"/>
<text x="800" y="70" class="title" font-size="42" text-anchor="middle">Figure 4 — Recursive Structural Intelligence</text>
<text x="800" y="110" class="subtitle" font-size="22" text-anchor="middle">CCC(CCC(X)): recursive generation of higher-order structural intelligence</text>
<circle cx="800" cy="500" r="340" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.18" filter="url(#glow)"/>
<circle cx="800" cy="500" r="265" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.22" filter="url(#glow)"/>
<circle cx="800" cy="500" r="190" fill="none" stroke="#fbbf24" stroke-width="6" opacity="0.25" filter="url(#glow)"/>
<circle cx="800" cy="500" r="115" fill="none" stroke="#fde68a" stroke-width="6" opacity="0.35" filter="url(#glow)"/>
<circle cx="800" cy="500" r="85" fill="url(#gold)" opacity="0.95" filter="url(#glow)"/>
<text x="800" y="492" class="label" font-size="24" text-anchor="middle">CCC</text>
<text x="800" y="524" class="label" font-size="24" text-anchor="middle">Core</text>
<rect x="630" y="110" width="340" height="140" class="box" rx="24"/>
<text x="800.0" y="148" class="small" font-size="20" text-anchor="middle">Base Structure</text>
<text x="800.0" y="174" class="small" font-size="20" text-anchor="middle">Graph / Runtime / Trajectory</text>
<rect x="945" y="430" width="340" height="140" class="box" rx="24"/>
<text x="1115.0" y="468" class="small" font-size="20" text-anchor="middle">CCC Layer 1</text>
<text x="1115.0" y="494" class="small" font-size="20" text-anchor="middle">Structural Core</text>
<rect x="630" y="770" width="340" height="140" class="box" rx="24"/>
<text x="800.0" y="808" class="small" font-size="20" text-anchor="middle">CCC Layer 2</text>
<text x="800.0" y="834" class="small" font-size="20" text-anchor="middle">Meta-Structure</text>
<rect x="315" y="430" width="340" height="140" class="box" rx="24"/>
<text x="485.0" y="468" class="small" font-size="20" text-anchor="middle">Recursive SI</text>
<text x="485.0" y="494" class="small" font-size="20" text-anchor="middle">Self-Evolving Structures</text>
<path d="M800 265 C1030 250 1190 390 1110 530 C1000 725 700 755 570 565 C455 395 590 245 790 240" class="arrowgold"/>
<path d="M800 330 C960 335 1040 445 980 560 C915 690 705 690 630 555 C560 430 650 330 795 330" class="arrow"/>
<text x="800" y="930" class="subtitle" font-size="24" text-anchor="middle">Recursive intelligence operates over its own CCC abstractions.</text>
</svg>
